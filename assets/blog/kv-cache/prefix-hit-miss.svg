<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
  <title id="title">稳定前缀怎样影响缓存命中</title>
  <desc id="desc">同样的系统规则、工具定义和历史消息保持在前面，动态状态追加在尾部，可以复用大部分前缀。把时间戳放进开头会让变化位置之后的缓存重新计算。</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b100c"/><stop offset="1" stop-color="#1a251b"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#d8dfd5" stroke-opacity=".08"/></pattern>
    <marker id="aGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#b7ff3c"/></marker>
    <marker id="aOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#ff9e5b"/></marker>
  </defs>
  <rect width="1000" height="640" rx="28" fill="url(#night)"/>
  <rect width="1000" height="640" rx="28" fill="url(#grid)"/>
  <text x="52" y="58" fill="#f5f1e8" font-size="26" font-weight="800" font-family="system-ui, sans-serif">缓存沿着 token 前缀连续命中</text>
  <text x="52" y="88" fill="#9ca69c" font-size="16" font-family="system-ui, sans-serif">模型比较的是 token 序列；文字意思相近也不能替代逐 token 对齐</text>

  <g transform="translate(52 128)" font-family="system-ui, sans-serif">
    <text x="0" y="20" fill="#b7ff3c" font-size="15" font-weight="800">A / 动态信息放在末尾</text>
    <g transform="translate(0 42)" font-size="14" font-weight="700">
      <rect width="174" height="72" rx="12" fill="#263128" stroke="#778277"/><text x="87" y="43" text-anchor="middle" fill="#f5f1e8">系统规则</text>
      <rect x="184" width="174" height="72" rx="12" fill="#263128" stroke="#778277"/><text x="271" y="43" text-anchor="middle" fill="#f5f1e8">工具定义</text>
      <rect x="368" width="174" height="72" rx="12" fill="#263128" stroke="#778277"/><text x="455" y="43" text-anchor="middle" fill="#f5f1e8">对话历史</text>
      <rect x="552" width="170" height="72" rx="12" fill="#35442f" stroke="#b7ff3c"/><text x="637" y="31" text-anchor="middle" fill="#b7ff3c">当前状态</text><text x="637" y="52" text-anchor="middle" fill="#d8e0d6" font-size="12">时间 / 页面 / 任务</text>
      <rect x="732" width="164" height="72" rx="12" fill="#b7ff3c"/><text x="814" y="43" text-anchor="middle" fill="#142015">本轮问题</text>
    </g>
    <path d="M0 132H522" stroke="#b7ff3c" stroke-width="4" marker-end="url(#aGreen)"/>
    <text x="0" y="158" fill="#cbd2c8" font-size="13">前三段完全相同：这一长段前缀可以直接复用</text>
  </g>

  <path d="M52 334H948" stroke="#3b463d"/>

  <g transform="translate(52 366)" font-family="system-ui, sans-serif">
    <text x="0" y="20" fill="#ff9e5b" font-size="15" font-weight="800">B / 时间戳写进开头</text>
    <g transform="translate(0 42)" font-size="14" font-weight="700">
      <rect width="174" height="72" rx="12" fill="#553725" stroke="#ff9e5b"/><text x="87" y="31" text-anchor="middle" fill="#ffc69f">系统规则</text><text x="87" y="52" text-anchor="middle" fill="#f5f1e8" font-size="12">10:31 → 10:32</text>
      <rect x="184" width="174" height="72" rx="12" fill="#352d26" stroke="#80593c"/><text x="271" y="43" text-anchor="middle" fill="#bdaea4">工具定义</text>
      <rect x="368" width="174" height="72" rx="12" fill="#352d26" stroke="#80593c"/><text x="455" y="43" text-anchor="middle" fill="#bdaea4">对话历史</text>
      <rect x="552" width="170" height="72" rx="12" fill="#352d26" stroke="#80593c"/><text x="637" y="43" text-anchor="middle" fill="#bdaea4">当前状态</text>
      <rect x="732" width="164" height="72" rx="12" fill="#352d26" stroke="#80593c"/><text x="814" y="43" text-anchor="middle" fill="#bdaea4">本轮问题</text>
    </g>
    <path d="M8 132H162" stroke="#ff9e5b" stroke-width="4" marker-end="url(#aOrange)"/>
    <path d="M184 132H896" stroke="#ff9e5b" stroke-opacity=".35" stroke-width="4" stroke-dasharray="8 7"/>
    <text x="0" y="158" fill="#e7c8b4" font-size="13">变化很靠前：首个不同 token 之后的状态需要重新计算</text>
  </g>

  <g transform="translate(52 574)" font-family="system-ui, sans-serif">
    <rect width="896" height="38" rx="10" fill="#202a22"/>
    <text x="18" y="25" fill="#dce3da" font-size="14">判断顺序：先保证上下文含义正确，再把稳定内容前置，把频繁变化的内容追加到尾部。</text>
  </g>
</svg>
